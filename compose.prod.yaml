services:
  db:
    image: mysql:8.4
    container_name: chumen-mysql-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chumen}
      MYSQL_USER: ${MYSQL_USER:-chumen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - chumen_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: chumen-api-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ⚠️ 该服务器网络的 DNS(53端口)被内网网关劫持：无论用哪个 DNS，api.map.baidu.com 都被解析到
    # 10.173.x.x(返回 [E1002] Fail to find method)，导致百度同步全部失败。
    # 因此在容器 hosts 里直接钉死百度真实公网 IP(14.215.182.24, api.map.n.shifen.com)，绕过 DNS。
    extra_hosts:
      - "api.map.baidu.com:14.215.182.24"
    environment:
      NODE_ENV: production
      PORT: 3100
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: mysql://${MYSQL_USER:-chumen}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-chumen}
      SHADOW_DATABASE_URL: mysql://${MYSQL_USER:-chumen}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-chumen}_shadow
      DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      IDENTITY_SUBJECT_HMAC_KEY: ${IDENTITY_SUBJECT_HMAC_KEY:?IDENTITY_SUBJECT_HMAC_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.chumenliuliu.cloud}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://www.chumenliuliu.cloud}
      # 微信小程序登录（jscode2session）：与上面同理，必须在此显式透传，
      # 值来自 GitHub Secret DEPLOY_ENV_FILE。留空时登录接口返回 503 AUTH_PROVIDER_UNAVAILABLE。
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 附近加油站：百度地图地点检索（定时同步用）。
      # ⚠️ 必须在此显式透传：本服务用 environment 逐项列举（没有 env_file），
      # 只把变量写进 .env.production 是进不了容器的。留空即关闭同步。
      STATION_SYNC_ENABLED: ${STATION_SYNC_ENABLED:-false}
      STATION_SYNC_CITIES: ${STATION_SYNC_CITIES:-}
      STATION_SYNC_CALL_BUDGET: ${STATION_SYNC_CALL_BUDGET:-}
      # 手动触发同步的令牌；设置后可用 POST /v1/fuel/sync 立即同步（便于验证）。
      STATION_SYNC_TRIGGER_TOKEN: ${STATION_SYNC_TRIGGER_TOKEN:-}
      # 加油站数据源：百度地图（STATION_PROVIDER=baidu 时启用）；AK 由部署变量注入。
      BAIDU_MAP_AK: ${BAIDU_MAP_AK:-}
      BAIDU_MAP_SK: ${BAIDU_MAP_SK:-}
      # 加油站/天气数据源：高德开放平台（STATION_PROVIDER 默认 amap）；Key 由部署变量注入。
      AMAP_MAP_KEY: ${AMAP_MAP_KEY:-}
      # 数据源切换：amap(默认) / baidu / osm
      STATION_PROVIDER: ${STATION_PROVIDER:-amap}
    volumes:
      - chumen_uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: chumen-web-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ${WEB_NGINX_CONFIG:-/opt/chumen/nginx/production.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-/opt/chumen/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/opt/chumen/certbot-webroot}:/var/www/certbot:ro

volumes:
  chumen_mysql_prod_data:
  chumen_uploads_prod:
