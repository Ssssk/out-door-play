services:
  db:
    image: mysql:8.4
    container_name: chumen-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chumen}
      MYSQL_USER: ${MYSQL_USER:-chumen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - chumen_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: chumen-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: mysql://${MYSQL_USER:-chumen}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-chumen}
      DATABASE_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"
      IDENTITY_SUBJECT_HMAC_KEY: ${IDENTITY_SUBJECT_HMAC_KEY:?IDENTITY_SUBJECT_HMAC_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: chumen-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  chumen_mysql_prod_data:
