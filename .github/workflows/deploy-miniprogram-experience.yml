name: Deploy WeChat Mini Program experience

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - tools/miniprogram-ci/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - project.config.json
      - .github/workflows/deploy-miniprogram-experience.yml
  workflow_dispatch:

concurrency:
  group: wechat-miniprogram-experience
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-experience:
    if: github.ref == 'refs/heads/main' && vars.WECHAT_MINIPROGRAM_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate WeChat release description
        shell: bash
        run: |
          set -euo pipefail
          node tools/miniprogram-ci/describe-change.mjs \
            --sha "$GITHUB_SHA" \
            --output wechat-release-description.txt
          test -s wechat-release-description.txt

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install application dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build WeChat Mini Program
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.WECHAT_MINIPROGRAM_API_BASE_URL }}
          VITE_DEV_IDENTITY_ENABLED: 'false'
        run: |
          set -euo pipefail
          test -n "$VITE_API_BASE_URL"
          pnpm build:mp-weixin

      - name: Package upload payload
        uses: actions/upload-artifact@v4
        with:
          name: wechat-upload-payload-${{ github.run_id }}
          path: |
            apps/mobile/dist/build/mp-weixin
            tools/miniprogram-ci/package.json
            tools/miniprogram-ci/package-lock.json
            tools/miniprogram-ci/describe-change.mjs
            tools/miniprogram-ci/upload.mjs
            wechat-release-description.txt
          if-no-files-found: error
          retention-days: 1

  upload-experience:
    needs: build-experience
    if: needs.build-experience.result == 'success'
    runs-on: [self-hosted, linux, x64, wechat-uploader]
    timeout-minutes: 15
    environment: miniprogram-experience
    steps:
      - name: Prepare isolated upload workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_WORKSPACE"
          test -n "$RUNNER_TEMP"
          case "$GITHUB_WORKSPACE" in
            /opt/actions-runner/_work/*) ;;
            *) echo "Unexpected self-hosted workspace" >&2; exit 1 ;;
          esac
          rm -rf -- "$GITHUB_WORKSPACE/runner-payload"
          rm -rf -- "$RUNNER_TEMP/wechat-miniprogram-ci"

      - name: Download upload payload
        uses: actions/download-artifact@v4
        with:
          name: wechat-upload-payload-${{ github.run_id }}
          path: runner-payload

      - name: Activate provisioned Node.js
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/node-v22.23.2/bin/node
          test -x /opt/node-v22.23.2/bin/npm
          echo "/opt/node-v22.23.2/bin" >> "$GITHUB_PATH"
          /opt/node-v22.23.2/bin/node --version
          env PATH="/opt/node-v22.23.2/bin:$PATH" /opt/node-v22.23.2/bin/npm --version

      - name: Install isolated WeChat uploader
        shell: bash
        run: npm ci --prefix runner-payload/tools/miniprogram-ci --ignore-scripts --no-audit

      - name: Materialize upload key
        shell: bash
        env:
          WECHAT_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$WECHAT_MINIPROGRAM_PRIVATE_KEY"
          install -m 700 -d "$RUNNER_TEMP/wechat-miniprogram-ci"
          printf '%s\n' "$WECHAT_MINIPROGRAM_PRIVATE_KEY" > "$RUNNER_TEMP/wechat-miniprogram-ci/private.key"
          chmod 600 "$RUNNER_TEMP/wechat-miniprogram-ci/private.key"

      - name: Load generated release description
        shell: bash
        run: |
          set -euo pipefail
          description_file="$GITHUB_WORKSPACE/runner-payload/wechat-release-description.txt"
          test -s "$description_file"
          description="$(tr '\r\n' '  ' < "$description_file")"
          test -n "$description"
          test "${#description}" -le 128
          printf 'WECHAT_MINIPROGRAM_DESC=%s\n' "$description" >> "$GITHUB_ENV"
          printf '发布备注：%s\n' "$description"

      - name: Upload development version and create experience QR code
        shell: bash
        env:
          WECHAT_MINIPROGRAM_APPID: ${{ vars.WECHAT_MINIPROGRAM_APPID }}
          WECHAT_MINIPROGRAM_ROBOT: ${{ vars.WECHAT_MINIPROGRAM_ROBOT }}
          WECHAT_MINIPROGRAM_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-miniprogram-ci/private.key
          WECHAT_MINIPROGRAM_PROJECT_PATH: ${{ github.workspace }}/runner-payload/apps/mobile/dist/build/mp-weixin
          WECHAT_MINIPROGRAM_VERSION: 1.0.${{ github.run_number }}
          WECHAT_MINIPROGRAM_QR_PATH: ${{ github.workspace }}/runner-payload/artifacts/wechat-preview-qrcode.jpg
        run: npm --prefix runner-payload/tools/miniprogram-ci run upload

      - name: Upload experience QR code artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-experience-qrcode-${{ github.run_number }}
          path: runner-payload/artifacts/wechat-preview-qrcode.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Clean upload key and workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_WORKSPACE"
          test -n "$RUNNER_TEMP"
          case "$GITHUB_WORKSPACE" in
            /opt/actions-runner/_work/*) ;;
            *) echo "Unexpected self-hosted workspace" >&2; exit 1 ;;
          esac
          rm -f -- "$RUNNER_TEMP/wechat-miniprogram-ci/private.key"
          rm -rf -- "$RUNNER_TEMP/wechat-miniprogram-ci"
          rm -rf -- "$GITHUB_WORKSPACE/runner-payload"
