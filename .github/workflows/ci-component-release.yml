name: Component CI release

on:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/admin/**
      - apps/mobile/**
      - tools/miniprogram-ci/**
      - tools/ci/**
      - docker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - project.config.json
      - compose.prod.yaml
      - .github/workflows/ci-component-release.yml
      - .github/workflows/deploy-miniprogram-experience.yml
  workflow_dispatch:

concurrency:
  group: component-ci-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  detect-changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.components.outputs.backend }}
      admin: ${{ steps.components.outputs.admin }}
      mobile: ${{ steps.components.outputs.mobile }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: components
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.before }}
          CHANGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node tools/ci/changed-components.mjs \
            --base "$CHANGE_BASE" \
            --sha "$CHANGE_SHA" \
            --output components.env
          cat components.env >> "$GITHUB_OUTPUT"

  backend-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/chumen_ci
      SHADOW_DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/chumen_ci_shadow
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install application dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run backend quality gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @chumen/api type-check
          pnpm --filter @chumen/api test
          pnpm --filter @chumen/api test:contract
          pnpm --filter @chumen/api build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backend container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: chumen-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  admin-ci:
    needs: [detect-changes, backend-ci]
    if: >-
      always() &&
      needs.detect-changes.outputs.admin == 'true' &&
      (needs.detect-changes.outputs.backend != 'true' || needs.backend-ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install application dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run admin quality gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @chumen/admin type-check
          pnpm --filter @chumen/admin test
          pnpm --filter @chumen/admin build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify admin container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: false
          tags: chumen-web:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  mobile-ci:
    needs: [detect-changes, backend-ci, admin-ci]
    if: >-
      always() &&
      needs.detect-changes.outputs.mobile == 'true' &&
      (needs.detect-changes.outputs.backend != 'true' || needs.backend-ci.result == 'success') &&
      (needs.detect-changes.outputs.admin != 'true' || needs.admin-ci.result == 'success')
    uses: ./.github/workflows/deploy-miniprogram-experience.yml
    secrets: inherit
