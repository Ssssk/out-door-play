name: One-shot production deploy dispatch (CHG-SCENE-EXPANSION-001)

# 本机无 GitHub CLI / Token，无法直接调用 workflow_dispatch；该文件仅在带
# [deploy-scene-expansion-001] 标记的 main 提交上派发既有 deploy-production.yml，
# 部署成功后由后续提交删除。它不改变 production Environment 的审批要求。
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[deploy-scene-expansion-001]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy-production.yml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "dispatched deploy-production.yml for $GITHUB_SHA"
