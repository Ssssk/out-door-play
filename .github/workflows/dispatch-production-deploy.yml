name: Dispatch production deploy

# 2026-11-13：随打卡口径扩展再次派发部署
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-deploy.yml'

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Deploy production
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Ssssk/out-door-play/actions/workflows/deploy-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "dispatched Deploy production"
