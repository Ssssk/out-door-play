name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: chumen-api
  WEB_IMAGE: chumen-web

jobs:
  build-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          api_image="${API_IMAGE,,}:${GITHUB_SHA}"
          web_image="${WEB_IMAGE,,}:${GITHUB_SHA}"
          {
            echo "api_image=$api_image"
            echo "web_image=$web_image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify API image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: ${{ steps.images.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify admin image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: false
          tags: ${{ steps.images.outputs.web_image }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload production compose
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$deploy_dir' '$deploy_dir/nginx' '$deploy_dir/ops'"
          scp -i "$HOME/.ssh/id_deploy" -P "$deploy_port" compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/compose.prod.yaml"
          # web 容器的 nginx 配置由宿主机文件挂载进容器（compose.prod.yaml 的 WEB_NGINX_CONFIG），
          # 必须随仓库下发，否则宿主机残留旧配置（曾缺 client_max_body_size → 上传 >1MB 图片返回 413）。
          scp -i "$HOME/.ssh/id_deploy" -P "$deploy_port" docker/nginx/production.conf "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/nginx/production.conf"
          # 发布前维护脚本用于释放 Docker 构建空间、保护最近回滚镜像并清理旧 release 目录。
          scp -i "$HOME/.ssh/id_deploy" -P "$deploy_port" scripts/production-docker-maintenance.sh "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/ops/production-docker-maintenance.sh"

      - name: Write deployment environment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ADMIN_ALLOWED_ORIGINS: ${{ secrets.ADMIN_ALLOWED_ORIGINS }}
          ADMIN_COOKIE_SECURE: ${{ secrets.ADMIN_COOKIE_SECURE }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          # 硬编码 amap：高德为主源；不读 vars.STATION_PROVIDER，避免仓库残留的 baidu 配置把源又切回去
          STATION_PROVIDER: amap
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK || vars.BAIDU_MAP_AK }}
          BAIDU_MAP_SK: ${{ secrets.BAIDU_MAP_SK || vars.BAIDU_MAP_SK }}
          AMAP_MAP_KEY: ${{ secrets.AMAP_MAP_KEY || vars.AMAP_MAP_KEY }}
          STATION_SYNC_TRIGGER_TOKEN: ${{ secrets.STATION_SYNC_TRIGGER_TOKEN }}
          API_IMAGE: ${{ needs.build-images.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENV_FILE"
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          test -n "$WECHAT_APP_ID"
          test -n "$WECHAT_APP_SECRET"
          test -n "$CORS_ORIGINS"
          test -n "$ADMIN_ALLOWED_ORIGINS"
          test "$ADMIN_COOKIE_SECURE" = "true"
          DEPLOY_ENV_FILE="$(printf '%s\n' "$DEPLOY_ENV_FILE" | sed '/^WECHAT_APP_ID=/d; /^WECHAT_APP_SECRET=/d; /^STATION_SYNC_ENABLED=/d; /^STATION_SYNC_CITIES=/d; /^BAIDU_MAP_AK=/d; /^BAIDU_MAP_SK=/d; /^AMAP_MAP_KEY=/d; /^CORS_ORIGINS=/d; /^ADMIN_ALLOWED_ORIGINS=/d; /^ADMIN_COOKIE_SECURE=/d; /^STATION_SYNC_TRIGGER_TOKEN=/d')"
          DEPLOY_ENV_FILE="$(printf '%s\nCORS_ORIGINS=%s\nADMIN_ALLOWED_ORIGINS=%s\nADMIN_COOKIE_SECURE=%s\nWECHAT_APP_ID=%s\nWECHAT_APP_SECRET=%s\nSTATION_SYNC_ENABLED=true\nSTATION_PROVIDER=%s\nBAIDU_MAP_AK=%s\nBAIDU_MAP_SK=%s\nAMAP_MAP_KEY=%s\nSTATION_SYNC_TRIGGER_TOKEN=%s\nSTATION_SYNC_CITIES=110000,310000,320100,330100,420100,430100,440100,440300,500000,510100,450200\n' "$DEPLOY_ENV_FILE" "$CORS_ORIGINS" "$ADMIN_ALLOWED_ORIGINS" "$ADMIN_COOKIE_SECURE" "$WECHAT_APP_ID" "$WECHAT_APP_SECRET" "$STATION_PROVIDER" "$BAIDU_MAP_AK" "$BAIDU_MAP_SK" "$AMAP_MAP_KEY" "$STATION_SYNC_TRIGGER_TOKEN")"
          env_payload="$(printf '%s\nAPI_IMAGE=%s\nWEB_IMAGE=%s\n' "$DEPLOY_ENV_FILE" "$API_IMAGE" "$WEB_IMAGE" | base64 -w0)"
          printf '%s' "$env_payload" | ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "base64 -d > '$deploy_dir/.env.production' && chmod 600 '$deploy_dir/.env.production'"

      - name: Pre-build production Docker maintenance
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/id_deploy" -p "$deploy_port" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash '$deploy_dir/ops/production-docker-maintenance.sh' '$deploy_dir'"

      - name: Upload Docker build context
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          release_dir="$deploy_dir/releases/$GITHUB_SHA"
          tar -czf - .dockerignore package.json pnpm-lock.yaml pnpm-workspace.yaml apps/api apps/admin apps/mobile/package.json apps/mobile/src/static docker website \
            | ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'"

      - name: Build images on test server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          API_IMAGE: ${{ needs.build-images.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          release_dir="$deploy_dir/releases/$GITHUB_SHA"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "docker pull docker.1ms.run/library/node:22-bookworm-slim && docker tag docker.1ms.run/library/node:22-bookworm-slim node:22-bookworm-slim && docker pull docker.1ms.run/library/nginx:1.27-alpine && docker tag docker.1ms.run/library/nginx:1.27-alpine nginx:1.27-alpine && docker pull docker.1ms.run/library/mysql:8.4 && docker tag docker.1ms.run/library/mysql:8.4 mysql:8.4 && cd '$release_dir' && docker build --build-arg DEBIAN_MIRROR=http://mirrors.tencent.com/debian --build-arg DEBIAN_SECURITY_MIRROR=http://mirrors.tencent.com/debian-security --build-arg PNPM_REGISTRY=https://registry.npmmirror.com -f docker/api.Dockerfile -t '$API_IMAGE' . && docker build --build-arg PNPM_REGISTRY=https://registry.npmmirror.com -f docker/admin.Dockerfile -t '$WEB_IMAGE' ."

      - name: Migrate and restart
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$deploy_dir' && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api db:deploy && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api admin:sync-permissions && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api migrate:route-covers && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api migrate:clear-description-placeholder && docker compose --env-file .env.production -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 120"

      - name: Data-source connectivity self-check (inside api container)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          # 把自检脚本喂进 api 容器的 node 执行：打印容器内注入的 AK/SK 指纹(长度+md5前8)，
          # 并用 SN 签名真实调用一次百度接口，一次性区分「密钥未注入/SK 不匹配/出网失败」，
          # 输出只含指纹与百度状态码，不泄露密钥明文
          ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' && docker compose --env-file .env.production -f compose.prod.yaml exec -T api node" \
            < apps/api/scripts/baidu-selftest.mjs

      - name: Disk & web proxy diagnostics (truncation suspect)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          # 大响应(>64KB≈proxy_buffers 总量)被截断的嫌疑：磁盘满导致 nginx 临时缓冲写失败。
          # 打出宿主机/容器磁盘水位、docker 占用与 web 容器近期错误日志。
          ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' && echo '=== df -h ===' && df -h && echo '=== docker system df ===' && docker system df && echo '=== web 容器错误日志 ===' && (docker compose --env-file .env.production -f compose.prod.yaml logs --since 30m web 2>&1 | grep -aiE 'error|emerg|alert|no space|denied|failed' | tail -30 || true) && echo '=== web 容器内磁盘 ===' && docker compose --env-file .env.production -f compose.prod.yaml exec -T web df -h / /var/cache/nginx /var/lib/nginx 2>/dev/null || true"

      - name: Trigger station sync and print summary
        shell: bash
        env:
          STATION_SYNC_TRIGGER_TOKEN: ${{ secrets.STATION_SYNC_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$STATION_SYNC_TRIGGER_TOKEN" ]; then
            echo "::warning::STATION_SYNC_TRIGGER_TOKEN 未配置，无法手动触发同步，仅靠容器启动后的自动同步"
            exit 0
          fi
          # 直接调用同步端点，把同步执行摘要（城市数/调用数/取到/写入/清理/skipped 原因）打进日志，
          # 彻底消除「同步到底跑没跑、为什么没落库」的黑盒。摘要不含任何密钥。
          body=""
          for attempt in 1 2 3; do
            body="$(curl --silent --show-error --max-time 900 \
              --header "x-station-sync-token: $STATION_SYNC_TRIGGER_TOKEN" \
              --request POST https://www.chumenliuliu.cloud/v1/fuel/sync)" || body=""
            if printf '%s' "$body" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
              printf '%s' "$body" | python3 -c 'import json,sys; print("[sync-summary]", json.dumps(json.load(sys.stdin), ensure_ascii=False))'
              break
            fi
            echo "[sync-summary] 第 $attempt 次触发未拿到 JSON（可能启动自动同步尚在执行），30s 后重试"
            echo "  原始返回: $(printf '%s' "$body" | head -c 200)"
            sleep 30
          done

      - name: Print api sync logs (diagnose why stations not landing)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          # 打出 api 容器最近 15 分钟里与站点同步相关的日志：provider 选择、每城采集结果、失败原因全在这里
          ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' && docker compose --env-file .env.production -f compose.prod.yaml logs --since 15m api" \
            | grep -aE "站点同步|高德|provider|Nest.*started|error|Error" | tail -100 || true

      - name: Smoke test live fuel POI
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 https://www.chumenliuliu.cloud/v1/health)"
          printf '%s' "$health" | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("code") == 0 and body.get("data", {}).get("status") == "ok"'
          poi=""
          # 站点同步在容器启动 30s 后才运行，且每城最多 10 页串行调用需 1~3 分钟；
          # 这里轮询等待首批「非腾讯」站点（高德 am- / 百度 bd-）落库，避免与启动延迟竞态导致部署误报；
          # 注意：武汉等城市库里可能有历史腾讯 tx- 残留，故必须要求 am-/bd- 而非 tx-，否则会假绿
          for attempt in $(seq 1 20); do
            if poi="$(curl --fail --silent --show-error --max-time 30 'https://www.chumenliuliu.cloud/v1/fuel/stations?lat=30.5928&lng=114.3055&page=1&pageSize=10')" \
              && printf '%s' "$poi" | python3 -c 'import json,sys; body=json.load(sys.stdin); items=(body.get("data") or {}).get("items") or []; assert body.get("code") == 0 and any(str(i.get("id", "")).startswith(("am-", "bd-")) for i in items)' 2>/dev/null; then
              break
            fi
            echo "waiting for station sync... attempt $attempt/20"
            sleep 15
            poi=""
          done
          if [ -z "$poi" ]; then
            echo "::error::5 分钟内未见 am-/bd- 站点落库（武汉可能有历史 tx- 残留，故必须高德 am- 或百度 bd- 落库才算成功）。同步失败常见原因：AMAP_MAP_KEY 未注入/无效（看 self-check 与 docker logs 中「高德地点检索失败」）"
            exit 1
          fi
          printf '%s' "$poi" | python3 -c 'import json,sys; body=json.load(sys.stdin); data=body.get("data") or {}; items=data.get("items") or []; assert any(str(item.get("id", "")).startswith(("am-", "bd-")) for item in items) and all(float(item.get("distanceKm", -1)) >= 0 for item in items); print(json.dumps({"status":"passed","count":len(items),"total":data.get("total"),"firstId":(items[0].get("id") if items else None)}, ensure_ascii=False))'
          auth_file="$(mktemp)"
          auth_status="$(curl --silent --show-error --max-time 20 --output "$auth_file" --write-out '%{http_code}' --header 'content-type: application/json' --data '{"code":"deployment-invalid-code-probe"}' https://www.chumenliuliu.cloud/v1/auth/wechat/login)"
          AUTH_STATUS="$auth_status" python3 - "$auth_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding='utf-8') as response:
              body = json.load(response)
          assert os.environ['AUTH_STATUS'] == '401', (os.environ['AUTH_STATUS'], body.get('code'))
          assert body.get('code') == 'AUTH_CODE_INVALID', body.get('code')
          print(json.dumps({'status': 'passed', 'code': body.get('code')}, ensure_ascii=False))
          PY
          rm -f "$auth_file"
