name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: chumen-api
  WEB_IMAGE: chumen-web

jobs:
  build-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          api_image="${API_IMAGE,,}:${GITHUB_SHA}"
          web_image="${WEB_IMAGE,,}:${GITHUB_SHA}"
          {
            echo "api_image=$api_image"
            echo "web_image=$web_image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify API image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: ${{ steps.images.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify admin image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: false
          tags: ${{ steps.images.outputs.web_image }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload production compose
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$deploy_dir' '$deploy_dir/nginx'"
          scp -i "$HOME/.ssh/id_deploy" -P "$deploy_port" compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/compose.prod.yaml"
          # web 容器的 nginx 配置由宿主机文件挂载进容器（compose.prod.yaml 的 WEB_NGINX_CONFIG），
          # 必须随仓库下发，否则宿主机残留旧配置（曾缺 client_max_body_size → 上传 >1MB 图片返回 413）。
          scp -i "$HOME/.ssh/id_deploy" -P "$deploy_port" docker/nginx/production.conf "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/nginx/production.conf"

      - name: Write deployment environment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ADMIN_ALLOWED_ORIGINS: ${{ secrets.ADMIN_ALLOWED_ORIGINS }}
          ADMIN_COOKIE_SECURE: ${{ secrets.ADMIN_COOKIE_SECURE }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY || vars.TENCENT_MAP_KEY }}
          TENCENT_MAP_SECRET: ${{ secrets.TENCENT_MAP_SECRET || vars.TENCENT_MAP_SECRET }}
          API_IMAGE: ${{ needs.build-images.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENV_FILE"
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          test -n "$WECHAT_APP_ID"
          test -n "$WECHAT_APP_SECRET"
          test -n "$TENCENT_MAP_KEY"
          test -n "$CORS_ORIGINS"
          test -n "$ADMIN_ALLOWED_ORIGINS"
          test "$ADMIN_COOKIE_SECURE" = "true"
          DEPLOY_ENV_FILE="$(printf '%s\n' "$DEPLOY_ENV_FILE" | sed '/^WECHAT_APP_ID=/d; /^WECHAT_APP_SECRET=/d; /^TENCENT_MAP_KEY=/d; /^TENCENT_MAP_SECRET=/d; /^STATION_SYNC_ENABLED=/d; /^CORS_ORIGINS=/d; /^ADMIN_ALLOWED_ORIGINS=/d; /^ADMIN_COOKIE_SECURE=/d')"
          DEPLOY_ENV_FILE="$(printf '%s\nCORS_ORIGINS=%s\nADMIN_ALLOWED_ORIGINS=%s\nADMIN_COOKIE_SECURE=%s\nWECHAT_APP_ID=%s\nWECHAT_APP_SECRET=%s\nTENCENT_MAP_KEY=%s\nTENCENT_MAP_SECRET=%s\nSTATION_SYNC_ENABLED=false\n' "$DEPLOY_ENV_FILE" "$CORS_ORIGINS" "$ADMIN_ALLOWED_ORIGINS" "$ADMIN_COOKIE_SECURE" "$WECHAT_APP_ID" "$WECHAT_APP_SECRET" "$TENCENT_MAP_KEY" "$TENCENT_MAP_SECRET")"
          env_payload="$(printf '%s\nAPI_IMAGE=%s\nWEB_IMAGE=%s\n' "$DEPLOY_ENV_FILE" "$API_IMAGE" "$WEB_IMAGE" | base64 -w0)"
          printf '%s' "$env_payload" | ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "base64 -d > '$deploy_dir/.env.production' && chmod 600 '$deploy_dir/.env.production'"

      - name: Upload Docker build context
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          release_dir="$deploy_dir/releases/$GITHUB_SHA"
          tar -czf - .dockerignore package.json pnpm-lock.yaml pnpm-workspace.yaml apps/api apps/admin apps/mobile/package.json apps/mobile/src/static docker website \
            | ssh -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'"

      - name: Build images on test server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          API_IMAGE: ${{ needs.build-images.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-images.outputs.web_image }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          release_dir="$deploy_dir/releases/$GITHUB_SHA"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "docker pull docker.1ms.run/library/node:22-bookworm-slim && docker tag docker.1ms.run/library/node:22-bookworm-slim node:22-bookworm-slim && docker pull docker.1ms.run/library/nginx:1.27-alpine && docker tag docker.1ms.run/library/nginx:1.27-alpine nginx:1.27-alpine && docker pull docker.1ms.run/library/mysql:8.4 && docker tag docker.1ms.run/library/mysql:8.4 mysql:8.4 && cd '$release_dir' && docker build --build-arg DEBIAN_MIRROR=http://mirrors.tencent.com/debian --build-arg DEBIAN_SECURITY_MIRROR=http://mirrors.tencent.com/debian-security --build-arg PNPM_REGISTRY=https://registry.npmmirror.com -f docker/api.Dockerfile -t '$API_IMAGE' . && docker build --build-arg PNPM_REGISTRY=https://registry.npmmirror.com -f docker/admin.Dockerfile -t '$WEB_IMAGE' ."

      - name: Migrate and restart
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/chumen}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "$HOME/.ssh/id_deploy" -p "$deploy_port" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$deploy_dir' && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api db:deploy && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api admin:sync-permissions && docker compose --env-file .env.production -f compose.prod.yaml run --rm api pnpm --filter @chumen/api migrate:route-covers && docker compose --env-file .env.production -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 120"

      - name: Smoke test live fuel POI
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 https://www.chumenliuliu.cloud/v1/health)"
          printf '%s' "$health" | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("code") == 0 and body.get("data", {}).get("status") == "ok"'
          poi="$(curl --fail --silent --show-error --max-time 30 'https://www.chumenliuliu.cloud/v1/fuel/stations?lat=30.5928&lng=114.3055&page=1&pageSize=10')"
          printf '%s' "$poi" | python3 -c 'import json,sys; body=json.load(sys.stdin); data=body.get("data") or {}; items=data.get("items") or []; assert body.get("code") == 0 and items and all(str(item.get("id", "")).startswith("tx-") for item in items) and all(float(item.get("distanceKm", -1)) >= 0 for item in items); print(json.dumps({"status":"passed","count":len(items),"total":data.get("total"),"firstId":items[0].get("id")}, ensure_ascii=False))'
          auth_file="$(mktemp)"
          auth_status="$(curl --silent --show-error --max-time 20 --output "$auth_file" --write-out '%{http_code}' --header 'content-type: application/json' --data '{"code":"deployment-invalid-code-probe"}' https://www.chumenliuliu.cloud/v1/auth/wechat/login)"
          AUTH_STATUS="$auth_status" python3 - "$auth_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding='utf-8') as response:
              body = json.load(response)
          assert os.environ['AUTH_STATUS'] == '401', (os.environ['AUTH_STATUS'], body.get('code'))
          assert body.get('code') == 'AUTH_CODE_INVALID', body.get('code')
          print(json.dumps({'status': 'passed', 'code': body.get('code')}, ensure_ascii=False))
          PY
          rm -f "$auth_file"
