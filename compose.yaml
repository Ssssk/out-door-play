services:
  mysql:
    image: mysql:8.4
    container_name: chumen-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chumen_local
      MYSQL_USER: chumen
      MYSQL_PASSWORD: chumen_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - chumen_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  chumen_mysql_data:
