openapi: 3.0.3
info:
  title: "admin-foundation API delta"
  version: "1.0.0"
paths:
  /v1/admin/auth/login:
    post:
      summary: 管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200': { description: 登录成功并设置 HttpOnly Cookie }
        '401': { $ref: '#/components/responses/AuthFailed' }
        '429': { description: 尝试过多 }
  /v1/admin/auth/session:
    get:
      summary: 恢复当前管理员会话并签发新的 CSRF token
      responses:
        '200': { description: 当前主体、权限与 CSRF token }
        '401': { description: 会话无效或过期 }
  /v1/admin/auth/logout:
    post:
      summary: 撤销当前会话
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已撤销并清除 Cookie }
        '401': { description: 未认证 }
        '403': { description: CSRF 或 Origin 校验失败 }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
  schemas:
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
  responses:
    AuthFailed:
      description: 用户名或密码错误（统一公开消息）
security:
  - adminSession: []

