version: 1
errors:
  - code: AUTH_CODE_INVALID
    httpStatus: 401
    meaning: 微信一次性 code 无效、已使用或身份响应不完整；不暴露平台原始错误
    clientAction: 重新调用 uni.login 获取新 code，不自动重放旧 code
  - code: AUTH_PROVIDER_UNAVAILABLE
    httpStatus: 503
    meaning: 微信身份提供方超时或暂时不可用
    clientAction: 显示稍后重试；重试时重新获取 code
  - code: AUTH_DEV_LOGIN_DISABLED
    httpStatus: 404
    meaning: 本地开发身份适配器未开启或当前为 production
    clientAction: 不展示 dev 登录，禁止回退为固定用户
  - code: AUTH_SESSION_INVALID
    httpStatus: 401
    meaning: access 缺失、无效、过期、撤销或用户禁用
    clientAction: 对幂等读最多尝试一次 refresh；失败后清会话并登录
  - code: AUTH_REFRESH_INVALID
    httpStatus: 401
    meaning: refresh 无效、过期、撤销或已被轮换
    clientAction: 原子清除 token pair 并重新登录
  - code: AUTH_RATE_LIMITED
    httpStatus: 429
    meaning: 登录或刷新尝试超过限制
    clientAction: 按 Retry-After 等待，不并发重试
  - code: USER_PROFILE_INVALID
    httpStatus: 422
    meaning: 昵称或头像引用不符合资料约束
    clientAction: 将字段错误关联到表单并保留输入
  - code: FAVORITE_DISCOVERY_NOT_FOUND
    httpStatus: 404
    meaning: Discovery 不存在或当前不可见
    clientAction: 保持原收藏状态并刷新详情/列表
  - code: COMMON_VALIDATION_FAILED
    httpStatus: 422
    meaning: 请求字段、枚举或未知字段不符合契约
    clientAction: 修正输入，不自动重试
