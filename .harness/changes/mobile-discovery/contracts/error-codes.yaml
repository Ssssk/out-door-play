version: 1
errors:
  - code: COMMON_VALIDATION_FAILED
    httpStatus: 422
    meaning: 请求参数不符合要求
    clientAction: 修正参数；页面保持当前成功内容
  - code: DISCOVERY_NOT_FOUND
    httpStatus: 404
    meaning: 内容不存在或已下线
    clientAction: 展示资源不可用并允许返回
  - code: COMMON_NETWORK_ERROR
    httpStatus: 0
    meaning: 网络请求失败
    clientAction: 展示 fallback 或重试

