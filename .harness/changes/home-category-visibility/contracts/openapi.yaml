openapi: 3.0.3
info:
  title: "home-category-visibility API delta"
  version: "1.0.0"
  description: "首页分类目录运行时配置：公开只读、管理端读写。默认配置与上线前可见行为一致。"
paths:
  /v1/config/scene-tabs:
    get:
      operationId: getPublicSceneTabs
      summary: 小程序端读取首页启用分类
      tags: [config]
      security: []
      responses:
        '200':
          description: 启用分类列表（只包含 enabled=true 的项，按 sort 升序、scene 字典序稳定排序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSceneTabs'
        '500':
          description: 服务异常；客户端必须回退内置默认配置
  /v1/admin/config/scene-tabs:
    get:
      operationId: getAdminSceneTabs
      summary: 管理端读取首页分类全量配置
      tags: [admin-config]
      security:
        - adminSession: []
      responses:
        '200':
          description: 全量配置（含隐藏项）与并发 token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSceneTabs'
        '403':
          description: 缺少 config:read，沿用 admin-auth Guard 稳定错误码
    put:
      operationId: updateAdminSceneTabs
      summary: 管理端保存首页分类配置
      tags: [admin-config]
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSceneTabsRequest'
      responses:
        '200':
          description: 保存成功，返回新的 revision 与 updatedAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSceneTabs'
        '403':
          description: 缺少 config:write，沿用 admin-auth Guard 稳定错误码
        '409':
          description: CONFIG_VERSION_CONFLICT，expectedUpdatedAt 已过期
        '422':
          description: COMMON_VALIDATION_FAILED 或 CONFIG_INVALID（空数组、未知 scene、重复 scene、空 label、sort 越界、0 个启用项）
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: session
      description: 沿用现有管理端 Cookie 会话 + X-CSRF-Token 机制，本 Change 不新增鉴权方式
  schemas:
    Scene:
      type: string
      enum: [drive, fish]
      description: 与 Prisma enum Scene 一致；后台不能新增业务场景
    PublicSceneTab:
      type: object
      additionalProperties: false
      required: [scene, label, sort]
      properties:
        scene:
          $ref: '#/components/schemas/Scene'
        label:
          type: string
          minLength: 1
          maxLength: 12
          description: 纯文本显示名称，前端插值渲染
        sort:
          type: integer
          minimum: 0
          maximum: 9999
    PublicSceneTabs:
      type: object
      additionalProperties: false
      required: [revision, updatedAt, items]
      properties:
        revision:
          type: integer
          minimum: 0
          description: 配置版本，同时参与小程序列表缓存 key
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC；未配置时为 null
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicSceneTab'
    AdminSceneTab:
      allOf:
        - $ref: '#/components/schemas/PublicSceneTab'
        - type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: false 表示隐藏；列表拒绝、详情保留
    AdminSceneTabs:
      type: object
      additionalProperties: false
      required: [revision, updatedAt, items]
      properties:
        revision:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: 未配置时为 null；作为保存时的并发 token
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminSceneTab'
    UpdateSceneTabsRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt, items]
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: 管理端 GET 返回的 updatedAt；未配置时传 null。服务端用 updateMany 条件更新，count=0 返回 409
        items:
          type: array
          minItems: 1
          maxItems: 2
          description: 至少 1 个启用项；scene 不重复且只能取 drive/fish
          items:
            $ref: '#/components/schemas/AdminSceneTab'
